name: Android library
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  schedule:
    # Pick up new game versions automatically. Only games whose repo HEAD moved are rebuilt.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish APK and downloadable game packages
        type: boolean
        default: false
      update_games:
        description: Only rebuild and publish games with new commits (no APK)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'schedule' && !inputs.update_games
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ inputs.publish && 'game-library-release' || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test package manifests
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - name: Build downloadable games
        if: github.event_name == 'workflow_dispatch'
        run: python3 android/tools/package-games.py --published-catalog --changed-only --bundle-catalog
      - name: Configure release signing
        if: inputs.publish
        env:
          KEY: ${{ secrets.ANF_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then echo 'Set ANF_KEYSTORE_B64 and ANF_KEYSTORE_PASSWORD to publish a stable signed APK.'; exit 1; fi
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/anf.keystore"
      - name: Build and check
        env:
          ANF_KEYSTORE: ${{ inputs.publish && format('{0}/anf.keystore', runner.temp) || '' }}
          ANF_KEYSTORE_PASSWORD: ${{ secrets.ANF_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANF_KEYSTORE" ]; then unset ANF_KEYSTORE; fi
          cd android
          ./gradlew assembleDebug testDebugUnitTest lintDebug
          if [ '${{ inputs.publish }}' = 'true' ]; then ./gradlew assembleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: anf-games-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/packages/*
            android/app/build/reports/
      - name: Publish library
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/packages/anf-games.apk
          android/tools/publish-release.sh android/packages/anf-games.apk
  update-games:
    if: github.event_name == 'schedule' || inputs.update_games
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: game-library-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package manifests
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - name: Rebuild games with new commits
        run: python3 android/tools/package-games.py --published-catalog --changed-only
      # Runs even if one game failed: the others still ship, and the failed one keeps its old package.
      - name: Publish updated games
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: android/tools/publish-release.sh
