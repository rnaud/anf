name: Android library
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish APK and downloadable game packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build downloadable games
        if: github.event_name == 'workflow_dispatch'
        run: python3 android/tools/package-games.py --bundle-catalog
      - name: Configure release signing
        if: inputs.publish
        env:
          KEY: ${{ secrets.ANF_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then echo 'Set ANF_KEYSTORE_B64 and ANF_KEYSTORE_PASSWORD to publish a stable signed APK.'; exit 1; fi
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/anf.keystore"
      - name: Build and check
        env:
          ANF_KEYSTORE: ${{ inputs.publish && format('{0}/anf.keystore', runner.temp) || '' }}
          ANF_KEYSTORE_PASSWORD: ${{ secrets.ANF_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANF_KEYSTORE" ]; then unset ANF_KEYSTORE; fi
          cd android
          ./gradlew assembleDebug testDebugUnitTest lintDebug
          if [ '${{ inputs.publish }}' = 'true' ]; then ./gradlew assembleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: anf-games-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/packages/*
            android/app/build/reports/
      - name: Publish library
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/packages/anf-games.apk
          gh release view game-library || gh release create game-library --title 'anf games for Android' --notes 'Install anf-games.apk. Browser games download inside the app. Jumpman and Alexandria open separately.'
          # Upload immutable packages first; the catalog is the last file switched.
          gh release upload game-library android/packages/*.zip android/packages/anf-games.apk --clobber
          gh release upload game-library android/packages/catalog.json --clobber
